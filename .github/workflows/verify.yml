name: verify

# Nothing ran on a pull request before this workflow existed: `verify` scripts
# lived in package.json and were only ever invoked by hand, so a branch could
# reach a reviewer with a type error, a failing test, or a bundle that does
# not build.
on:
  push:
    branches: [main]
  pull_request:
    # `labeled` is not a default type, and adding the `simulators` label is how
    # the macOS job below is asked for. Everything else stays as it was.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the customer app to the Expo Go preview channel after the gate passes'
        type: boolean
        default: false
      publish_operator:
        description: 'Also publish the operator app (creates its EAS project on first use)'
        type: boolean
        default: false
      simulators:
        description: 'Launch both apps on their own named iOS simulators (macOS runner)'
        type: boolean
        default: false

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Reads the pinned version from the root package.json `packageManager`.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # `--frozen-lockfile`: the lockfile is the contract, and a job that
      # silently resolves a different tree is not verifying what ships.
      - run: pnpm install --frozen-lockfile

      - name: Lint all workspaces
        run: pnpm -r --workspace-concurrency=1 lint

      - name: Typecheck all workspaces
        run: pnpm -r --workspace-concurrency=1 typecheck

      - name: Test all workspaces
        run: pnpm -r --workspace-concurrency=1 test

      # Menu photographs are a design contract like tokens are, and nothing
      # enforced it before: 61 assets had drifted to a 5x spread in exposure
      # and were stored in a shape no render site actually used. This fails if
      # an asset no longer matches MENU_IMAGE_SPEC. It reports, but does not
      # fail on, the photographs that are outside what grading may fix -- those
      # need reshooting, and are tracked in docs/MENU-IMAGERY.md.
      - name: Check menu imagery against the spec
        run: pnpm normalize-menu-images --check

      # The bundle is part of the gate. Lint and tsc both pass on code Metro
      # cannot resolve -- a missing asset or a bad platform-specific import
      # only shows up here.
      - name: Bundle the customer app for iOS
        working-directory: apps/customer
        run: npx expo export --platform ios

      - name: Bundle the customer app for web
        working-directory: apps/customer
        run: npx expo export --platform web

      - name: Bundle the operator app for iOS
        working-directory: apps/operator
        run: npx expo export --platform ios

  # Everything above is static; this job is the only place the schema's SQL
  # actually executes. `supabase start` (Docker lives on the hosted runners;
  # the dev container has no daemon) applies supabase/migrations/ and the
  # config.toml auth hook, then the tests exercise RLS with real hook-minted
  # JWTs, the order state machine, webhook replay, and the idempotency key.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start the Supabase stack (applies supabase/migrations)
        run: supabase start
      - name: Run integration tests against the stack
        run: |
          set -euo pipefail
          eval "$(supabase status -o env | sed 's/^/export /')"
          export SUPABASE_TEST_URL="$API_URL"
          export SUPABASE_TEST_ANON_KEY="$ANON_KEY"
          export SUPABASE_TEST_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          export SUPABASE_TEST_DB_URL="$DB_URL"
          pnpm --filter @platform/integration-tests test

  # The three-apps-together proof: a guest signs in with an email code and
  # places a real order in the customer web build, the operator board works
  # it over Realtime, and HQ's dashboard carries the money — one seeded
  # supabase-CLI stack, the real onboarding path, the real API, real RLS.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start the Supabase stack (applies supabase/migrations)
        run: supabase start
      - name: Install the Playwright browser
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium
      - name: Seed the tenant through the real onboarding path
        run: |
          set -euo pipefail
          eval "$(supabase status -o env | sed 's/^/export /')"
          export SUPABASE_URL="$API_URL"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          pnpm onboard --tenant coffee-story
      - name: Build the three app surfaces against the stack
        run: |
          set -euo pipefail
          eval "$(supabase status -o env | sed 's/^/export /')"
          ( cd apps/customer && \
            EXPO_PUBLIC_SUPABASE_URL="$API_URL" \
            EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$ANON_KEY" \
            EXPO_PUBLIC_API_URL="http://127.0.0.1:4383" \
            npx expo export --platform web --output-dir dist-e2e )
          ( cd apps/operator && \
            EXPO_PUBLIC_SUPABASE_URL="$API_URL" \
            EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$ANON_KEY" \
            npx expo export --platform web --output-dir dist-e2e )
          pnpm --filter @platform/hq build
      - name: Run the end-to-end suite
        run: |
          set -euo pipefail
          eval "$(supabase status -o env | sed 's/^/export /')"
          export SUPABASE_TEST_URL="$API_URL"
          export SUPABASE_TEST_ANON_KEY="$ANON_KEY"
          export SUPABASE_TEST_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          export SUPABASE_TEST_DB_URL="$DB_URL"
          export E2E_CUSTOMER_DIR="$GITHUB_WORKSPACE/apps/customer/dist-e2e"
          export E2E_OPERATOR_DIR="$GITHUB_WORKSPACE/apps/operator/dist-e2e"
          export E2E_HQ_DIR="$GITHUB_WORKSPACE/apps/hq"
          export E2E_SHOT_DIR="$GITHUB_WORKSPACE/e2e-shots"
          pnpm --filter @platform/e2e-tests test
      - name: Keep the walkthrough screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e-shots/
          if-no-files-found: ignore

  # Both Expo apps, each on its OWN named iOS simulator, on a real macOS
  # runner. This is the one thing a Linux box cannot check: simulators need
  # the full Xcode app, so until now "the apps launch on a device" was only
  # ever verified as a web export in a headless browser.
  #
  # Off unless asked for: macOS runners are ten times the cost of Linux ones
  # (free here only because this repository is public), so the job runs when
  # the `simulators` label is on the pull request, or on a manual dispatch
  # with the input set. Never on an ordinary push.
  simulators:
    if: >-
      (github.event_name == 'pull_request'
        && contains(github.event.pull_request.labels.*.name, 'simulators'))
      || (github.event_name == 'workflow_dispatch' && inputs.simulators)
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CUSTOMER_SIM: coffee story cust
      OPERATOR_SIM: coffee story ops
      CUSTOMER_PORT: '8081'
      OPERATOR_PORT: '8083'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Create the two named simulators
        run: |
          set -euo pipefail
          xcrun simctl list -j runtimes > /tmp/runtimes.json
          xcrun simctl list -j devicetypes > /tmp/devicetypes.json
          # No `mapfile`: GitHub runs macOS steps under /bin/bash, which is
          # still bash 3.2, where that builtin does not exist -- it exits 127
          # and takes the python it was reading from with it (a broken pipe).
          python3 scripts/ci/simulator-devices.py /tmp/runtimes.json /tmp/devicetypes.json > /tmp/picked.txt
          cat /tmp/picked.txt
          RUNTIME=$(sed -n 1p /tmp/picked.txt)
          PHONE=$(sed -n 2p /tmp/picked.txt)
          TABLET=$(sed -n 3p /tmp/picked.txt)
          if [ -z "$RUNTIME" ] || [ -z "$PHONE" ] || [ -z "$TABLET" ]; then
            echo "Could not choose a runtime and two device types."; exit 1
          fi
          echo "runtime=$RUNTIME"; echo "phone=$PHONE"; echo "tablet=$TABLET"
          CUSTOMER_UDID=$(xcrun simctl create "$CUSTOMER_SIM" "$PHONE" "$RUNTIME")
          OPERATOR_UDID=$(xcrun simctl create "$OPERATOR_SIM" "$TABLET" "$RUNTIME")
          echo "CUSTOMER_UDID=$CUSTOMER_UDID" >> "$GITHUB_ENV"
          echo "OPERATOR_UDID=$OPERATOR_UDID" >> "$GITHUB_ENV"
          xcrun simctl list devices available

      - name: Boot both simulators before opening anything on them
        run: |
          set -euo pipefail
          # The ordering the launcher script exists to enforce: opening a deep
          # link on a device that is still booting is what times out.
          xcrun simctl bootstatus "$CUSTOMER_UDID" -b
          xcrun simctl bootstatus "$OPERATOR_UDID" -b

      - name: Start both Metro servers
        run: |
          set -euo pipefail
          cd apps/customer && nohup npx expo start --port "$CUSTOMER_PORT" > "$GITHUB_WORKSPACE/metro-customer.log" 2>&1 &
          cd "$GITHUB_WORKSPACE/apps/operator" && nohup npx expo start --port "$OPERATOR_PORT" > "$GITHUB_WORKSPACE/metro-operator.log" 2>&1 &
          cd "$GITHUB_WORKSPACE"
          for port in "$CUSTOMER_PORT" "$OPERATOR_PORT"; do
            for _ in $(seq 1 120); do
              if curl -fs --max-time 2 "http://127.0.0.1:$port/status" >/dev/null 2>&1; then break; fi
              sleep 2
            done
            if ! curl -fs --max-time 2 "http://127.0.0.1:$port/status" >/dev/null 2>&1; then
              echo "Metro never answered on :$port"; cat "$GITHUB_WORKSPACE"/metro-*.log; exit 1
            fi
            echo "Metro is up on :$port"
          done

      - name: Put Expo Go on both devices
        run: |
          set -euo pipefail
          # api.expo.dev names the client build for the SDK this repo pins, so
          # Expo Go arrives without depending on @expo/cli internals -- and
          # without the interactive `i` keypress that fetches it locally.
          curl -fsSL https://api.expo.dev/v2/versions/latest -o /tmp/expo-versions.json
          URL=$(python3 scripts/ci/expo-go-url.py /tmp/expo-versions.json 54.0.0)
          echo "Expo Go: $URL"
          curl -fsSL "$URL" -o /tmp/expo-go.tar.gz
          mkdir -p /tmp/expo-go && tar -xzf /tmp/expo-go.tar.gz -C /tmp/expo-go
          APP=$(find /tmp/expo-go -maxdepth 3 -name '*.app' | head -1)
          echo "installing $APP"
          xcrun simctl install "$CUSTOMER_UDID" "$APP"
          xcrun simctl install "$OPERATOR_UDID" "$APP"

      - name: Open each app on its own device
        run: |
          set -euo pipefail
          open_app() {
            udid="$1"; port="$2"; name="$3"
            for try in 1 2 3; do
              if xcrun simctl openurl "$udid" "exp://127.0.0.1:$port"; then
                echo "$name opening (attempt $try)"; return 0
              fi
              sleep 5
            done
            echo "$name would not open"; return 1
          }
          open_app "$CUSTOMER_UDID" "$CUSTOMER_PORT" "Customer app"
          open_app "$OPERATOR_UDID" "$OPERATOR_PORT" "Operator app"

      - name: Wait for each app to actually load its JavaScript
        run: |
          set -euo pipefail
          # Metro logs "Bundled" only when a real client fetched and ran the
          # bundle, so this is the app running, not just the deep link firing.
          for pair in "metro-customer.log|Customer" "metro-operator.log|Operator"; do
            log="${pair%%|*}"; label="${pair##*|}"
            for _ in $(seq 1 90); do
              if grep -q "Bundled" "$GITHUB_WORKSPACE/$log"; then break; fi
              sleep 5
            done
            if grep -q "Bundled" "$GITHUB_WORKSPACE/$log"; then
              echo "$label bundled and running:"
              grep -m3 "Bundled" "$GITHUB_WORKSPACE/$log"
            else
              echo "$label never bundled. Metro said:"; tail -60 "$GITHUB_WORKSPACE/$log"; exit 1
            fi
          done

      - name: Screenshot both simulators
        if: always()
        run: |
          mkdir -p sim-shots
          sleep 20  # let the first frame settle after the bundle lands
          xcrun simctl io "${CUSTOMER_UDID:-none}" screenshot "sim-shots/customer-coffee-story-cust.png" || true
          xcrun simctl io "${OPERATOR_UDID:-none}" screenshot "sim-shots/operator-coffee-story-ops.png" || true
          ls -la sim-shots

      - name: Keep the screenshots and the Metro logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshots
          path: |
            sim-shots/
            metro-customer.log
            metro-operator.log
          if-no-files-found: warn

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Both graphs, because `expo` is a production dependency that drags the
      # whole bundler in with it -- the metro/image-size advisories this repo
      # pins around showed up in the production-only audit.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Audit the full dependency graph
        run: pnpm audit --audit-level=high

  # Publishes the Expo Go demo of the customer app. This lives in the same
  # workflow as the gate rather than in its own file so it can `needs:` those
  # jobs directly -- a separate workflow could only watch for them with
  # `workflow_run`, which runs against the default branch's copy of the file
  # and has to re-derive the sha.
  #
  # Preview only, deliberately. `apps/customer/app.json` pins `runtimeVersion`
  # to `exposdk:54.0.0` for every channel (docs/PRODUCTION_SETUP.md gap 2), so
  # a production update is runtime-compatible with Expo Go clients and preview
  # builds alike. Publishing production automatically would let a merge reach
  # store users. That stays a manual `pnpm run publish:production` in
  # apps/customer.
  #
  # Dispatch-only, at the owner's request: merging to main runs the gate but
  # never publishes. A deploy happens when someone triggers this workflow with
  # the publish input checked (Actions -> verify -> Run workflow).
  publish-preview:
    needs: [verify, audit]
    if: github.event_name == 'workflow_dispatch' && (inputs.publish || inputs.publish_operator)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Attach a GitHub Environment named `expo-preview` to this job to require a
    # human approval before each publish. Left off so the first publish works
    # without extra setup.
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Fails loudly rather than skipping. A publish job that quietly no-ops
      # reports green, and you find out the demo was never updated when someone
      # scans the QR and gets last month's build.
      #
      # Checked in the shell, not in `if:` -- the `secrets` context is not
      # available to a step-level condition, so `if: ${{ !secrets.EXPO_TOKEN }}`
      # would evaluate to false and the guard would never fire.
      #
      # Two secret names are accepted because the repo owner created theirs as
      # EXPO_GO_COFFEE; either satisfies the guard and both feed the same
      # EXPO_TOKEN env var eas-cli reads.
      - name: Require an EAS token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN || secrets.EXPO_GO_COFFEE }}
        run: |
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "::error::No EAS token is set. Create one at https://expo.dev/settings/access-tokens and add it as a repository secret named EXPO_TOKEN or EXPO_GO_COFFEE (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi
          echo "EAS token present."

      # `--environment preview` reads the preview environment's variables from
      # EAS server-side; nothing here is inlined from a local .env. Expo Go
      # opens in Demo whatever they contain -- see `parseStoredAppMode`.
      #
      # The commit subject reaches the CLI through the environment, never
      # interpolated into the shell: a commit message is attacker-controllable
      # text and `${{ }}` inside a `run:` is a command-injection hole.
      - name: Publish to the preview channel
        if: inputs.publish
        working-directory: apps/customer
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN || secrets.EXPO_GO_COFFEE }}
          COMMIT_SUBJECT: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          subject="${COMMIT_SUBJECT:-}"
          message="${subject%%$'\n'*}"
          [ -n "$message" ] || message="Manual publish of ${GITHUB_SHA:0:7}"
          # --json implies --non-interactive and puts everything that is not
          # JSON on stderr, so this redirect captures the manifest alone.
          # --silent keeps pnpm's own banner out of it too.
          pnpm --silent run publish:preview:all --json --message "$message" > update.json

      # Reporting must never turn a successful publish red, so this step is
      # `continue-on-error`: by the time it runs the update is already live.
      - name: Report the QR and deep link
        if: inputs.publish
        continue-on-error: true
        run: node .github/scripts/report-update.mjs apps/customer/update.json

      # The operator app is one listing for every tenant (rule 7), so its EAS
      # project is fixed rather than tenant-generated. `eas init` links the
      # project by owner+slug from app.json, creating it on the first publish;
      # the projectId it writes into the CI workspace's app.json is never
      # committed. No --environment: the demo needs no EXPO_PUBLIC_* values.
      - name: Publish the operator app to the preview channel
        if: inputs.publish_operator
        working-directory: apps/operator
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN || secrets.EXPO_GO_COFFEE }}
          COMMIT_SUBJECT: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          npx eas-cli@21.4.0 init --non-interactive --force
          subject="${COMMIT_SUBJECT:-}"
          message="${subject%%$'\n'*}"
          [ -n "$message" ] || message="Manual operator publish of ${GITHUB_SHA:0:7}"
          pnpm --silent run publish:preview:all --json --message "$message" > update.json

      - name: Report the operator QR and deep link
        if: inputs.publish_operator
        continue-on-error: true
        run: node .github/scripts/report-update.mjs apps/operator/update.json

      - name: Keep the update manifest for the run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eas-update-manifest
          path: apps/customer/update.json
          if-no-files-found: ignore
