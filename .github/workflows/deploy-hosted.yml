name: deploy hosted surfaces

# Production deploys are intentionally owner-triggered. The verification
# workflow is the required gate; this workflow only runs after that gate has
# passed, and every credential comes from GitHub/Vercel secrets.
on:
  workflow_call:
    inputs:
      tenant:
        type: string
        default: coffee-story
      project_prefix:
        type: string
        default: coffee-story
      supabase_project_ref:
        type: string
        required: false
      environment:
        type: string
        default: production
      deploy_web:
        type: boolean
        default: true
      publish_native:
        type: boolean
        default: false
    secrets:
      VERCEL_TOKEN:
        required: true
      SUPABASE_ACCESS_TOKEN:
        required: true
      SUPABASE_URL:
        required: false
      SUPABASE_PUBLISHABLE_KEY:
        required: false
      SUPABASE_SERVICE_ROLE_KEY:
        required: false
      SUPABASE_JWT_SECRET:
        required: false
      CRON_SECRET:
        required: true
      HEALTH_CHECK_TOKEN:
        required: true
      OPENAI_API_KEY:
        required: false
      DISPLAY_DEVICE_TOKEN:
        required: false
      DISPLAY_DEVICE_REFRESH_SECRET:
        required: false
      EXPO_TOKEN:
        required: false
      EXPO_GO_COFFEE:
        required: false
      EXPO_PUBLIC_API_URL:
        required: false
      EXPO_PUBLIC_ALLOWED_API_HOST:
        required: false
  workflow_dispatch:
    inputs:
      tenant:
        description: Tenant slug bundled into customer and kiosk surfaces
        type: string
        default: coffee-story
      project_prefix:
        description: Existing Vercel project prefix (prefix-hq, prefix-customer, etc.)
        type: string
        default: coffee-story
      supabase_project_ref:
        description: Hosted Supabase project reference (defaults to repository variable)
        type: string
        required: false
      environment:
        description: Vercel and EAS environment to promote
        type: choice
        options: [preview, production]
        default: production
      deploy_web:
        description: Deploy HQ and the tenant's declared hosted application surfaces
        type: boolean
        default: true
      publish_native:
        description: Publish production OTA updates to declared native application surfaces
        type: boolean
        default: false

concurrency:
  group: hosted-${{ inputs.project_prefix || 'coffee-story' }}-${{ inputs.environment || 'production' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE || 'tylerdevries222s-projects' }}
  SUPABASE_PROJECT_REF: ${{ inputs.supabase_project_ref || (inputs.environment == 'preview' && vars.SUPABASE_PREVIEW_PROJECT_REF) || vars.SUPABASE_PROJECT_REF }}
  PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
  PREVIEW_SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PREVIEW_PROJECT_REF }}
  TENANT: ${{ inputs.tenant || 'coffee-story' }}
  PROJECT_PREFIX: ${{ inputs.project_prefix || 'coffee-story' }}
  DEPLOY_ENVIRONMENT: ${{ inputs.environment || 'production' }}

jobs:
  release-policy:
    name: Validate tenant release policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment || 'production' }}
    outputs:
      all_surfaces: ${{ steps.surface-plan.outputs.all_surfaces }}
      artifact_digest: ${{ steps.artifact-digest.outputs.value }}
      web_matrix: ${{ steps.surface-plan.outputs.web_matrix }}
      web_count: ${{ steps.surface-plan.outputs.web_count }}
      native_matrix: ${{ steps.surface-plan.outputs.native_matrix }}
      native_count: ${{ steps.surface-plan.outputs.native_count }}
    steps:
      - name: Enforce deployment and database isolation
        run: |
          set -euo pipefail
          test "$PROJECT_PREFIX" = "$TENANT" || {
            echo '::error::The Vercel project prefix must exactly match the immutable tenant slug.'
            exit 1
          }
          test -n "$PRODUCTION_SUPABASE_PROJECT_REF" || {
            echo '::error::Set the canonical production SUPABASE_PROJECT_REF repository variable.'
            exit 1
          }
          test -n "$SUPABASE_PROJECT_REF" || {
            echo '::error::Set a Supabase project reference for this deployment environment.'
            exit 1
          }
          case "$DEPLOY_ENVIRONMENT" in
            preview)
              test -n "$PREVIEW_SUPABASE_PROJECT_REF" || {
                echo '::error::Set the canonical SUPABASE_PREVIEW_PROJECT_REF repository variable.'
                exit 1
              }
              test "$SUPABASE_PROJECT_REF" = "$PREVIEW_SUPABASE_PROJECT_REF" || {
                echo '::error::Preview deployments must target the canonical preview Supabase project.'
                exit 1
              }
              ;;
            production)
              test "$SUPABASE_PROJECT_REF" = "$PRODUCTION_SUPABASE_PROJECT_REF" || {
                echo '::error::Production deployments must target the canonical production Supabase project.'
                exit 1
              }
              ;;
            *)
              echo "::error::Unsupported deployment environment: $DEPLOY_ENVIRONMENT"
              exit 1
              ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resolve the declared tenant surface matrix
        id: surface-plan
        run: |
          set -euo pipefail
          plan=$(pnpm exec tsx scripts/release-surfaces.ts --tenant "$TENANT")
          printf '%s' "$plan" | jq -e '.all | index("hq")' >/dev/null
          {
            echo "all_surfaces=$(printf '%s' "$plan" | jq -r '.all | join(",")')"
            echo "web_matrix=$(printf '%s' "$plan" | jq -c '{include: [.web[] | {surface: .}]}')"
            echo "web_count=$(printf '%s' "$plan" | jq -r '.web | length')"
            echo "native_matrix=$(printf '%s' "$plan" | jq -c '{include: [.native[] | {surface: .}]}')"
            echo "native_count=$(printf '%s' "$plan" | jq -r '.native | length')"
          } >> "$GITHUB_OUTPUT"
          printf 'Tenant surfaces: %s\n' "$(printf '%s' "$plan" | jq -r '.all | join(", ")')"
      - name: Bind this run to one authoritative artifact digest
        id: artifact-digest
        env:
          SYNCHRONIZED_FACTORY_DIGEST: ${{ vars.FACTORY_ARTIFACT_DIGEST }}
        run: |
          set -euo pipefail
          digest=$(pnpm exec tsx scripts/tenant-artifact-digest.ts --tenant "$TENANT")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo '::error::The deployment artifact digest is missing or malformed.'
            exit 1
          }
          if [ -n "$SYNCHRONIZED_FACTORY_DIGEST" ] && [ "$SYNCHRONIZED_FACTORY_DIGEST" != "$digest" ]; then
            echo '::error::The synchronized factory digest does not match this checkout.'
            exit 1
          fi
          echo "value=$digest" >> "$GITHUB_OUTPUT"
      - name: Require approved production evidence and generated assets
        if: (inputs.environment || 'production') == 'production'
        env:
          FACTORY_ARTIFACT_DIGEST: ${{ steps.artifact-digest.outputs.value }}
          TENANT_SURFACES: ${{ steps.surface-plan.outputs.all_surfaces }}
        run: |
          set -euo pipefail
          pnpm release:gate --tenant "$TENANT" --commit "$GITHUB_SHA"
          case ",$TENANT_SURFACES," in
            *,customer,*|*,kiosk,*) pnpm onboard --tenant "$TENANT" --apply ;;
            *) echo 'No tenant-specific guest bundle is declared; onboarding materialization is not required.' ;;
          esac
          generated_changes=$(git status --porcelain=v1 --untracked-files=all -- tenants apps/customer apps/kiosk)
          test -z "$generated_changes" || {
            echo '::error::Tenant onboarding output must be generated and committed before production deployment.'
            printf '%s\n' "$generated_changes"
            exit 1
          }

  gate:
    name: Verify before deployment
    needs: release-policy
    uses: ./.github/workflows/verify.yml
    with:
      supabase_project_ref: ${{ inputs.supabase_project_ref || (inputs.environment == 'preview' && vars.SUPABASE_PREVIEW_PROJECT_REF) || vars.SUPABASE_PROJECT_REF }}
    secrets: inherit

  migrate-database:
    name: Promote verified database migrations
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply and verify forward-only target migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo '::error::Set SUPABASE_ACCESS_TOKEN.'; exit 1; }
          test -n "$SUPABASE_PROJECT_REF" || { echo '::error::Set SUPABASE_PROJECT_REF.'; exit 1; }
          pnpm supabase:promote

  deploy-hq:
    name: Deploy HQ API and console
    needs: [migrate-database, release-policy]
    if: inputs.deploy_web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      url: ${{ steps.deploy.outputs.url }}
      deployment_id: ${{ steps.deploy.outputs.deployment_id }}
      deployment_url: ${{ steps.deploy.outputs.deployment_url }}
      provider_evidence: ${{ steps.deploy.outputs.provider_evidence }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.116.0
      - name: Resolve the target Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo '::error::Set SUPABASE_ACCESS_TOKEN.'; exit 1; }
          test -n "$SUPABASE_PROJECT_REF" || { echo '::error::Set SUPABASE_PROJECT_REF.'; exit 1; }
          keys=$(supabase projects api-keys --project-ref "$SUPABASE_PROJECT_REF" -o json)
          publishable=$(printf '%s' "$keys" | jq -r '[.[] | select(.type == "publishable")][0].api_key // [.[] | select(.name == "anon")][0].api_key')
          service_role=$(printf '%s' "$keys" | jq -r '[.[] | select(.name == "service_role")][0].api_key')
          test -n "$publishable" && test "$publishable" != null
          test -n "$service_role" && test "$service_role" != null
          echo "::add-mask::$service_role"
          {
            echo "SUPABASE_URL=https://${SUPABASE_PROJECT_REF}.supabase.co"
            echo "SUPABASE_PUBLISHABLE_KEY=$publishable"
            echo "SUPABASE_SERVICE_ROLE_KEY=$service_role"
          } >> "$GITHUB_ENV"
      - name: Require Vercel credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          HEALTH_CHECK_TOKEN: ${{ secrets.HEALTH_CHECK_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN" || { echo '::error::Set VERCEL_TOKEN.'; exit 1; }
          test -n "$SUPABASE_URL" || { echo '::error::Set SUPABASE_URL.'; exit 1; }
          test -n "$SUPABASE_PUBLISHABLE_KEY" || { echo '::error::Set SUPABASE_PUBLISHABLE_KEY.'; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo '::error::Set SUPABASE_SERVICE_ROLE_KEY.'; exit 1; }
          test -n "$CRON_SECRET" || { echo '::error::Set CRON_SECRET.'; exit 1; }
          test -n "$HEALTH_CHECK_TOKEN" || { echo '::error::Set HEALTH_CHECK_TOKEN.'; exit 1; }
      - name: Configure hosted server environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          HEALTH_CHECK_TOKEN: ${{ secrets.HEALTH_CHECK_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MENU_MODEL: ${{ vars.OPENAI_MENU_MODEL }}
          OPENAI_RESEARCH_MODEL: ${{ vars.OPENAI_RESEARCH_MODEL }}
          OPENAI_EVALUATION_MODEL: ${{ vars.OPENAI_EVALUATION_MODEL }}
          TENANT_SURFACES: ${{ needs.release-policy.outputs.all_surfaces }}
        run: |
          set -euo pipefail
          project="${PROJECT_PREFIX}-hq"
          add_secret() {
            local name="$1" value="$2"
            test -n "$value" || return 0
            pnpm exec vercel env add "$name" "$DEPLOY_ENVIRONMENT" \
              --project "$project" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" \
              --value "$value" --sensitive --force --yes >/dev/null
          }
          add_public() {
            local name="$1" value="$2"
            test -n "$value" || return 0
            pnpm exec vercel env add "$name" "$DEPLOY_ENVIRONMENT" \
              --project "$project" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" \
              --value "$value" --no-sensitive --force --yes >/dev/null
          }
          add_public SUPABASE_URL "$SUPABASE_URL"
          add_public NEXT_PUBLIC_SUPABASE_URL "$SUPABASE_URL"
          add_public NEXT_PUBLIC_SUPABASE_ANON_KEY "$SUPABASE_PUBLISHABLE_KEY"
          add_public NEXT_PUBLIC_HQ_URL "https://${project}.vercel.app"
          add_public TENANT "$TENANT"
          # The production console's Apps wall may embed only these canonical,
          # public surface origins. Preview HQ deployments intentionally leave
          # them unset so they never point at a production device or guest app.
          if [ "$DEPLOY_ENVIRONMENT" = production ]; then
            case ",$TENANT_SURFACES," in *,customer,*) add_public NEXT_PUBLIC_CUSTOMER_URL "https://${PROJECT_PREFIX}-customer.vercel.app" ;; esac
            case ",$TENANT_SURFACES," in *,operator,*) add_public NEXT_PUBLIC_OPERATOR_URL "https://${PROJECT_PREFIX}-operator.vercel.app" ;; esac
            case ",$TENANT_SURFACES," in *,kiosk,*) add_public NEXT_PUBLIC_KIOSK_URL "https://${PROJECT_PREFIX}-kiosk.vercel.app" ;; esac
            case ",$TENANT_SURFACES," in *,display,*) add_public NEXT_PUBLIC_DISPLAY_URL "https://${PROJECT_PREFIX}-display.vercel.app" ;; esac
          fi
          add_secret SUPABASE_SERVICE_ROLE_KEY "$SUPABASE_SERVICE_ROLE_KEY"
          # Required for issuing and validating kiosk/display device tokens.
          # Keep this optional so a web-only deployment can still fail closed
          # on device pairing without blocking its other hosted surfaces.
          add_secret SUPABASE_JWT_SECRET "$SUPABASE_JWT_SECRET"
          add_secret CRON_SECRET "$CRON_SECRET"
          add_secret HEALTH_CHECK_TOKEN "$HEALTH_CHECK_TOKEN"
          add_secret OPENAI_API_KEY "$OPENAI_API_KEY"
          add_public OPENAI_MENU_MODEL "$OPENAI_MENU_MODEL"
          add_public OPENAI_RESEARCH_MODEL "$OPENAI_RESEARCH_MODEL"
          add_public OPENAI_EVALUATION_MODEL "$OPENAI_EVALUATION_MODEL"
      - name: Stage, verify, and promote the exact HQ commit
        id: deploy
        env:
          FACTORY_ARTIFACT_DIGEST: ${{ needs.release-policy.outputs.artifact_digest }}
          HEALTH_CHECK_TOKEN: ${{ secrets.HEALTH_CHECK_TOKEN }}
          PROJECT: ${{ env.PROJECT_PREFIX }}-hq
          SURFACE: hq
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: bash scripts/vercel-stage-deployment.sh

  deploy-web:
    name: Deploy ${{ matrix.surface }} web app
    needs: [deploy-hq, release-policy]
    if: inputs.deploy_web && needs.release-policy.outputs.web_count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-policy.outputs.web_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.116.0
      - name: Resolve the target Supabase public configuration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo '::error::Set SUPABASE_ACCESS_TOKEN.'; exit 1; }
          keys=$(supabase projects api-keys --project-ref "$SUPABASE_PROJECT_REF" -o json)
          publishable=$(printf '%s' "$keys" | jq -r '[.[] | select(.type == "publishable")][0].api_key // [.[] | select(.name == "anon")][0].api_key')
          test -n "$publishable" && test "$publishable" != null
          {
            echo "SUPABASE_URL=https://${SUPABASE_PROJECT_REF}.supabase.co"
            echo "SUPABASE_PUBLISHABLE_KEY=$publishable"
          } >> "$GITHUB_ENV"
      - name: Configure hosted runtime environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DISPLAY_DEVICE_TOKEN: ${{ secrets.DISPLAY_DEVICE_TOKEN }}
          DISPLAY_DEVICE_REFRESH_SECRET: ${{ secrets.DISPLAY_DEVICE_REFRESH_SECRET }}
          PREVIEW_DIRECTORY: ${{ vars.PREVIEW_DIRECTORY }}
        run: |
          set -euo pipefail
          add_public() {
            local name="$1" value="$2"
            test -n "$value" || return 0
            pnpm exec vercel env add "$name" "$DEPLOY_ENVIRONMENT" \
              --project "${PROJECT_PREFIX}-${{ matrix.surface }}" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" \
              --value "$value" --no-sensitive --force --yes >/dev/null
          }
          add_secret() {
            local name="$1" value="$2"
            test -n "$value" || return 0
            pnpm exec vercel env add "$name" "$DEPLOY_ENVIRONMENT" \
              --project "${PROJECT_PREFIX}-${{ matrix.surface }}" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" \
              --value "$value" --sensitive --force --yes >/dev/null
          }
          if [ "${{ matrix.surface }}" = display ]; then
            add_public NEXT_PUBLIC_SUPABASE_URL "$SUPABASE_URL"
            add_public HQ_ORIGIN "${{ needs.deploy-hq.outputs.url }}"
            add_public TENANT "$TENANT"
            if [ "$DEPLOY_ENVIRONMENT" = production ]; then
              # Either credential keeps the screen up, so the two can be rolled
              # out in either order. The refresh secret is the durable one: a
              # static token goes dark twelve hours after this deploy.
              test -n "$DISPLAY_DEVICE_REFRESH_SECRET" || test -n "$DISPLAY_DEVICE_TOKEN" \
                || { echo '::error::Set DISPLAY_DEVICE_REFRESH_SECRET (preferred) or DISPLAY_DEVICE_TOKEN after pairing the production screen.'; exit 1; }
              add_public DISPLAY_DEMO_MODE 0
            else
              # A branch preview is a review surface, not a paired shop screen.
              # Keep production fail-closed while making preview deployments
              # independently demonstrable without reusing a live device token.
              add_public DISPLAY_DEMO_MODE 1
              add_public PREVIEW_DIRECTORY "$PREVIEW_DIRECTORY"
            fi
            add_secret DISPLAY_DEVICE_TOKEN "$DISPLAY_DEVICE_TOKEN"
            add_secret DISPLAY_DEVICE_REFRESH_SECRET "$DISPLAY_DEVICE_REFRESH_SECRET"
          else
            api_url="${{ needs.deploy-hq.outputs.url }}"
            api_host="${api_url#https://}"
            api_host="${api_host%%/*}"
            case "$api_host" in
              *.vercel.app) ;;
              *) echo '::error::The verified HQ deployment did not provide a Vercel hostname.'; exit 1 ;;
            esac
            add_public EXPO_PUBLIC_SUPABASE_URL "$SUPABASE_URL"
            add_public EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY "$SUPABASE_PUBLISHABLE_KEY"
            add_public EXPO_PUBLIC_API_URL "$api_url"
            add_public EXPO_PUBLIC_ALLOWED_API_HOST "$api_host"
            # EXPO_PUBLIC_TENANT, not TENANT: only EXPO_PUBLIC_* is inlined into
            # the bundle, so TENANT alone moved the Expo config's identity while
            # the bundle kept whichever tenant was applied. app.config.ts now
            # refuses that combination outright, which would have failed every
            # subsequent Vercel build of these two guest surfaces.
            add_public EXPO_PUBLIC_TENANT "$TENANT"
            if [ "$DEPLOY_ENVIRONMENT" = preview ]; then
              add_public EXPO_PUBLIC_PREVIEW_DIRECTORY "$PREVIEW_DIRECTORY"
            fi
          fi
      - name: Stage, verify, and promote the exact web commit
        id: deploy
        env:
          FACTORY_ARTIFACT_DIGEST: ${{ needs.release-policy.outputs.artifact_digest }}
          PROJECT: ${{ env.PROJECT_PREFIX }}-${{ matrix.surface }}
          SURFACE: ${{ matrix.surface }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: bash scripts/vercel-stage-deployment.sh

  publish-native:
    name: Publish ${{ matrix.surface }} native OTA update
    needs: [migrate-database, deploy-hq, release-policy]
    if: inputs.publish_native && inputs.deploy_web && inputs.environment == 'production' && needs.release-policy.outputs.native_count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-policy.outputs.native_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Materialize the approved tenant assets and app configuration
        if: matrix.surface == 'customer' || matrix.surface == 'kiosk'
        run: pnpm onboard --tenant "$TENANT" --apply
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.116.0
      - name: Resolve the target Supabase public configuration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          keys=$(supabase projects api-keys --project-ref "$SUPABASE_PROJECT_REF" -o json)
          publishable=$(printf '%s' "$keys" | jq -r '[.[] | select(.type == "publishable")][0].api_key // [.[] | select(.name == "anon")][0].api_key')
          test -n "$publishable" && test "$publishable" != null
          {
            echo "SUPABASE_URL=https://${SUPABASE_PROJECT_REF}.supabase.co"
            echo "SUPABASE_PUBLISHABLE_KEY=$publishable"
          } >> "$GITHUB_ENV"
      - name: Require EAS credentials and a verified HQ deployment
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN || secrets.EXPO_GO_COFFEE }}
          API_URL: ${{ needs.deploy-hq.outputs.url }}
        run: |
          test -n "$EXPO_TOKEN" || { echo '::error::Set EXPO_TOKEN.'; exit 1; }
          test -n "$API_URL" || { echo '::error::The verified HQ deployment did not return a URL.'; exit 1; }
      - name: Publish the exact declared native surface
        working-directory: apps/${{ matrix.surface }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN || secrets.EXPO_GO_COFFEE }}
          API_URL: ${{ needs.deploy-hq.outputs.url }}
        run: |
          set -euo pipefail
          api_host="${API_URL#https://}"
          api_host="${api_host%%/*}"
          if [ "${{ matrix.surface }}" = customer ] || [ "${{ matrix.surface }}" = kiosk ]; then
            export EXPO_PUBLIC_TENANT="$TENANT"
          fi
          export EXPO_PUBLIC_SUPABASE_URL="$SUPABASE_URL"
          export EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
          export EXPO_PUBLIC_API_URL="$API_URL"
          export EXPO_PUBLIC_ALLOWED_API_HOST="$api_host"
          npx --yes eas-cli@21.4.0 update --channel production --environment production --platform all --non-interactive
