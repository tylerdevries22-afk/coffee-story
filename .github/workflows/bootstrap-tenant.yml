name: bootstrap hosted tenant

on:
  workflow_dispatch:
    inputs:
      tenant:
        description: Tenant folder and immutable tenant slug
        type: string
        required: true
      project_prefix:
        description: Prefix shared by the five Vercel projects
        type: string
        required: true
      supabase_project_ref:
        description: Newly provisioned hosted Supabase project reference
        type: string
        required: true
      environment:
        description: Vercel environment to deploy after bootstrap
        type: choice
        options: [preview, production]
        default: production

concurrency:
  group: bootstrap-${{ inputs.supabase_project_ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  database:
    name: Migrate and seed hosted Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require hosted credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo '::error::Set SUPABASE_ACCESS_TOKEN.'; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo '::error::Set SUPABASE_DB_PASSWORD.'; exit 1; }
      - name: Apply forward-only migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ${{ inputs.supabase_project_ref }}
        run: |
          set -euo pipefail
          npx --yes supabase@2.116.0 link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          npx --yes supabase@2.116.0 db push --linked --include-all --password "$SUPABASE_DB_PASSWORD" --yes
          npx --yes supabase@2.116.0 db lint --linked --level warning --fail-on warning
      - name: Seed tenant data and immutable media
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TENANT: ${{ inputs.tenant }}
        run: pnpm onboard --tenant "$TENANT" --require-db

  deploy:
    name: Verify and deploy five surfaces
    needs: database
    uses: ./.github/workflows/deploy-hosted.yml
    with:
      tenant: ${{ inputs.tenant }}
      project_prefix: ${{ inputs.project_prefix }}
      environment: ${{ inputs.environment }}
      deploy_web: true
      publish_native: false
    secrets: inherit
