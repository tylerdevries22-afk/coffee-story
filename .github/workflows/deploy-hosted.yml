name: deploy hosted surfaces

# Production deploys are intentionally owner-triggered. The verification
# workflow is the required gate; this workflow only runs after that gate has
# passed, and every credential comes from GitHub/Vercel secrets.
on:
  workflow_dispatch:
    inputs:
      tenant:
        description: Tenant slug bundled into customer and kiosk surfaces
        type: string
        default: coffee-story
      project_prefix:
        description: Existing Vercel project prefix (prefix-hq, prefix-customer, etc.)
        type: string
        default: coffee-story
      environment:
        description: Vercel and EAS environment to promote
        type: choice
        options: [preview, production]
        default: production
      deploy_web:
        description: Deploy HQ, pickup display, and the three Expo web builds
        type: boolean
        default: true
      publish_native:
        description: Publish production OTA updates to all three EAS projects
        type: boolean
        default: false

concurrency:
  group: hosted-${{ inputs.project_prefix || 'coffee-story' }}-${{ inputs.environment || 'production' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  VERCEL_CLI_VERSION: 59.3.0
  VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE || 'tylerdevries222s-projects' }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
  TENANT: ${{ inputs.tenant || 'coffee-story' }}
  PROJECT_PREFIX: ${{ inputs.project_prefix || 'coffee-story' }}
  DEPLOY_ENVIRONMENT: ${{ inputs.environment || 'production' }}

jobs:
  gate:
    name: Verify before deployment
    uses: ./.github/workflows/verify.yml
    secrets: inherit

  deploy-hq:
    name: Deploy HQ API and console
    needs: gate
    if: inputs.deploy_web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require Vercel credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$VERCEL_TOKEN" || { echo '::error::Set VERCEL_TOKEN.'; exit 1; }
          test -n "$SUPABASE_URL" || { echo '::error::Set SUPABASE_URL.'; exit 1; }
          test -n "$SUPABASE_PUBLISHABLE_KEY" || { echo '::error::Set SUPABASE_PUBLISHABLE_KEY.'; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo '::error::Set SUPABASE_SERVICE_ROLE_KEY.'; exit 1; }
          test -n "$CRON_SECRET" || { echo '::error::Set CRON_SECRET.'; exit 1; }
      - name: Configure production server environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_RESEARCH_MODEL: ${{ vars.OPENAI_RESEARCH_MODEL }}
          OPENAI_EVALUATION_MODEL: ${{ vars.OPENAI_EVALUATION_MODEL }}
        run: |
          set -euo pipefail
          project="${PROJECT_PREFIX}-hq"
          add_secret() {
            local name="$1" value="$2"
            test -n "$value" || return 0
            npx --yes "vercel@${VERCEL_CLI_VERSION}" env add "$name" "$DEPLOY_ENVIRONMENT" \
              --project "$project" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" \
              --value "$value" --sensitive --force --yes >/dev/null
          }
          add_public() {
            local name="$1" value="$2"
            npx --yes "vercel@${VERCEL_CLI_VERSION}" env add "$name" "$DEPLOY_ENVIRONMENT" \
              --project "$project" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" \
              --value "$value" --no-sensitive --force --yes >/dev/null
          }
          add_public SUPABASE_URL "$SUPABASE_URL"
          add_public NEXT_PUBLIC_SUPABASE_URL "$SUPABASE_URL"
          add_public NEXT_PUBLIC_SUPABASE_ANON_KEY "$SUPABASE_PUBLISHABLE_KEY"
          add_secret SUPABASE_SERVICE_ROLE_KEY "$SUPABASE_SERVICE_ROLE_KEY"
          # Required for issuing and validating kiosk/display device tokens.
          # Keep this optional so a web-only deployment can still fail closed
          # on device pairing without blocking its other hosted surfaces.
          add_secret SUPABASE_JWT_SECRET "$SUPABASE_JWT_SECRET"
          add_secret CRON_SECRET "$CRON_SECRET"
          add_secret OPENAI_API_KEY "$OPENAI_API_KEY"
          add_public OPENAI_RESEARCH_MODEL "$OPENAI_RESEARCH_MODEL"
          add_public OPENAI_EVALUATION_MODEL "$OPENAI_EVALUATION_MODEL"
      - name: Rebuild and promote HQ
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          # Git integration uploads the commit without sending the entire
          # monorepo through the CLI (the source archive is larger than the
          # Vercel API's 10 MB direct-upload limit). Redeploying the stable
          # production alias picks up the commit already built by Vercel.
          target="${PROJECT_PREFIX}-hq.vercel.app"
          npx --yes "vercel@${VERCEL_CLI_VERSION}" redeploy "$target" \
            --target "$DEPLOY_ENVIRONMENT" --no-wait --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          echo "url=https://${target}" >> "$GITHUB_OUTPUT"
          echo "HQ promoted at https://${target}"

  deploy-web:
    name: Deploy ${{ matrix.surface }} web app
    needs: deploy-hq
    if: inputs.deploy_web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - surface: display
          - surface: customer
          - surface: operator
          - surface: kiosk
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Configure production runtime environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DISPLAY_DEVICE_TOKEN: ${{ secrets.DISPLAY_DEVICE_TOKEN }}
        run: |
          set -euo pipefail
          add_public() {
            local name="$1" value="$2"
            npx --yes "vercel@${VERCEL_CLI_VERSION}" env add "$name" "$DEPLOY_ENVIRONMENT" \
              --project "${PROJECT_PREFIX}-${{ matrix.surface }}" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" \
              --value "$value" --no-sensitive --force --yes >/dev/null
          }
          add_secret() {
            local name="$1" value="$2"
            test -n "$value" || return 0
            npx --yes "vercel@${VERCEL_CLI_VERSION}" env add "$name" "$DEPLOY_ENVIRONMENT" \
              --project "${PROJECT_PREFIX}-${{ matrix.surface }}" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" \
              --value "$value" --sensitive --force --yes >/dev/null
          }
          if [ "${{ matrix.surface }}" = display ]; then
            add_public NEXT_PUBLIC_SUPABASE_URL "$SUPABASE_URL"
            test -n "$DISPLAY_DEVICE_TOKEN" || { echo '::error::Set DISPLAY_DEVICE_TOKEN after pairing the production screen.'; exit 1; }
            add_secret DISPLAY_DEVICE_TOKEN "$DISPLAY_DEVICE_TOKEN"
          else
            add_public EXPO_PUBLIC_SUPABASE_URL "$SUPABASE_URL"
            add_public EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY "$SUPABASE_PUBLISHABLE_KEY"
            add_public EXPO_PUBLIC_API_URL "${{ needs.deploy-hq.outputs.url }}"
            add_public EXPO_PUBLIC_ALLOWED_API_HOST "${PROJECT_PREFIX}-hq.vercel.app"
            add_public TENANT "$TENANT"
          fi
      - name: Rebuild and promote web surface
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes "vercel@${VERCEL_CLI_VERSION}" redeploy "${PROJECT_PREFIX}-${{ matrix.surface }}.vercel.app" \
            --target "$DEPLOY_ENVIRONMENT" --no-wait --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"

  publish-native:
    name: Publish native OTA updates
    needs: gate
    if: inputs.publish_native && inputs.environment == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require EAS credentials and production API configuration
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
        run: |
          test -n "$EXPO_TOKEN" || { echo '::error::Set EXPO_TOKEN.'; exit 1; }
          test -n "$API_URL" || { echo '::error::Set EXPO_PUBLIC_API_URL to the deployed HQ URL.'; exit 1; }
      - name: Publish customer update
        working-directory: apps/customer
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_ALLOWED_API_HOST: ${{ secrets.EXPO_PUBLIC_ALLOWED_API_HOST }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: npx --yes eas-cli@21.4.0 update --channel production --environment production --platform all --non-interactive
      - name: Publish operator update
        working-directory: apps/operator
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_ALLOWED_API_HOST: ${{ secrets.EXPO_PUBLIC_ALLOWED_API_HOST }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: npx --yes eas-cli@21.4.0 update --channel production --platform all --non-interactive
      - name: Publish kiosk update
        working-directory: apps/kiosk
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_ALLOWED_API_HOST: ${{ secrets.EXPO_PUBLIC_ALLOWED_API_HOST }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: npx --yes eas-cli@21.4.0 update --channel production --platform all --non-interactive
