name: bootstrap hosted tenant

on:
  workflow_dispatch:
    inputs:
      tenant:
        description: Tenant folder and immutable tenant slug
        type: string
        required: true
      project_prefix:
        description: Prefix shared by the five Vercel projects
        type: string
        required: true
      supabase_project_ref:
        description: Newly provisioned hosted Supabase project reference
        type: string
        required: true
      environment:
        description: Vercel environment to deploy after bootstrap
        type: choice
        options: [preview, production]
        default: production

concurrency:
  group: bootstrap-${{ inputs.supabase_project_ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  database:
    name: Migrate and seed hosted Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v3
        with:
          version: 2.116.0
      - name: Require hosted credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo '::error::Set SUPABASE_ACCESS_TOKEN.'; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo '::error::Set SUPABASE_DB_PASSWORD.'; exit 1; }
      - name: Apply forward-only migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ${{ inputs.supabase_project_ref }}
        run: |
          set -euo pipefail
          supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --linked --include-all --password "$SUPABASE_DB_PASSWORD" --yes
          supabase db lint --linked --level warning --fail-on warning
      - name: Apply the production Auth policy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ inputs.supabase_project_ref }}
        run: |
          set -euo pipefail
          auth_config=$(curl --fail --silent --show-error --max-time 20 --retry 1 --retry-all-errors \
            -X PATCH -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data '{"password_hibp_enabled":true,"password_min_length":8}' \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/config/auth")
          [ "$(printf '%s' "$auth_config" | jq -r '.password_hibp_enabled')" = true ] \
            || { echo '::error::Leaked-password protection is unavailable; use a supported Supabase plan.'; exit 1; }
          [ "$(printf '%s' "$auth_config" | jq -r '.password_min_length')" -ge 8 ] \
            || { echo '::error::Supabase did not apply the eight-character password minimum.'; exit 1; }
      - name: Seed tenant data and immutable media
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ inputs.supabase_project_ref }}
          TENANT: ${{ inputs.tenant }}
        run: |
          set -euo pipefail
          keys=$(supabase projects api-keys --project-ref "$PROJECT_REF" -o json)
          export SUPABASE_URL="https://${PROJECT_REF}.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY=$(printf '%s' "$keys" \
            | jq -r '[.[] | select(.name == "service_role")][0].api_key')
          export SUPABASE_SERVICE_ROLE_KEY
          test -n "$SUPABASE_SERVICE_ROLE_KEY" && test "$SUPABASE_SERVICE_ROLE_KEY" != null
          echo "::add-mask::$SUPABASE_SERVICE_ROLE_KEY"
          pnpm onboard --tenant "$TENANT" --require-db

  deploy:
    name: Verify and deploy five surfaces
    needs: database
    uses: ./.github/workflows/deploy-hosted.yml
    with:
      tenant: ${{ inputs.tenant }}
      project_prefix: ${{ inputs.project_prefix }}
      supabase_project_ref: ${{ inputs.supabase_project_ref }}
      environment: ${{ inputs.environment }}
      deploy_web: true
      publish_native: false
    secrets: inherit
