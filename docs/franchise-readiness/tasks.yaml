    acceptance: UUID-only lookup, uniform 404, distributed limits, audit events, safe previews, and 30-second links.
  - id: TP-05
    title: Accessible responsive HQ Tenant package explorer
    status: pending
    depends_on: [TP-04]
    acceptance: Owner/admin navigation, keyboard tree, search, states, preview, download, and mobile drawer pass UI tests.
  - id: SEC-01
    title: Fail-closed production configuration and sensitive-path review
    status: pending
    depends_on: []
    acceptance: Production cannot enter demo mode; security scan and focused tests pass.
  - id: CI-01
    title: Pinned SAST, secrets, dependency, SBOM, DAST, and source-size gates
    status: pending
    depends_on: []
    acceptance: Inconclusive scans fail and weekly plus pull-request workflows are pinned and reproducible.
  - id: MOB-01
    title: Android and store-readiness verification
    status: in_progress
    depends_on: []
    # Landed: verify.yml now exports customer, operator, and kiosk for
    # Android alongside the existing iOS/web loop, and a separate step runs
    # `expo config --type introspect` for all three -- which evaluates every
    # config plugin, including with-media-projection.cjs -- and asserts the
    # resulting package name and permissions/blockedPermissions resolve.
    # Each app's own `verify` script exports Android the same way, so a
    # developer's local `pnpm verify` matches CI.
    # Still open: nothing here runs a real Gradle or EAS Android build, so a
    # Gradle-only syntax error, an XML-merge conflict between two plugins, or
    # a resource that only fails inside `gradlew assembleRelease` stays
    # invisible. Release metadata (Play listing copy, screenshots, signing
    # config, versionCode) and any other store-submission checks are also
    # not covered by this task.
    acceptance: Customer, operator, and kiosk each export for Android and have their
      config-plugin-resolved package name and permissions asserted, alongside the
      existing iOS/web gates; a real Gradle/EAS Android build and Play
      store-listing/release-metadata checks are separate, uncompleted work.
  - id: REF-01
    title: Staged 200-line source compliance
    status: pending
    depends_on: [TP-03, TP-04]
    acceptance: Critical files first, then every non-exempt source/test file passes the CI size gate.
  - id: QA-01
    title: Full franchise isolation and release verification
    status: pending
    depends_on: [TP-01, TP-02, TP-03, TP-04, TP-05, SEC-01, CI-01, MOB-01, REF-01]
    acceptance: All required checks pass and neutral demo isolation is verified across all five apps.
  - id: REL-01
    title: Evidence-bound rollout and rollback drill
    status: pending
    depends_on: [QA-01]
    acceptance: Neutral demo, Stillpoint, then Coffee Story advance only with matching approvals and rollback evidence.
