name: verify

# Nothing ran on a pull request before this workflow existed: `verify` scripts
# lived in package.json and were only ever invoked by hand, so a branch could
# reach a reviewer with a type error, a failing test, or a bundle that does
# not build.
on:
  workflow_call:
    inputs:
      supabase_project_ref:
        description: Parent hosted Supabase project used for the disposable branch
        type: string
        required: false
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the customer app to the Expo Go preview channel after the gate passes'
        type: boolean
        default: false
      publish_operator:
        description: 'Also publish the operator app (creates its EAS project on first use)'
        type: boolean
        default: false

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reads the pinned version from the root package.json `packageManager`.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      # `--frozen-lockfile`: the lockfile is the contract, and a job that
      # silently resolves a different tree is not verifying what ships.
      - run: pnpm install --frozen-lockfile

      # One command, defined once in the root package.json, so this job and a
      # developer's `pnpm verify` cannot drift. They had: the tenancy audits
      # (rule 4) and the typecheck of scripts/ ran only locally, so the gate
      # that keeps one shop's address out of every other shop's binary could
      # not fail a build; lint ran only here, so a warning passed locally.
      # Whatever this gate is, both sides now run all of it.
      - name: Verify all workspaces
        run: pnpm verify

      # The runner is UTC, and that hid a customer-facing bug for a whole
      # release: the drop board formatted its date range through the device
      # clock, so a window the shop advertised as opening the 20th read the
      # 19th on every phone west of UTC -- every guest of the first tenant.
      # Under UTC the two clocks agree and the suite stayed green. Running it
      # a second time on the shop's own zone is what makes that class of bug
      # fail here instead of on a guest's phone.
      - name: Test all workspaces on a non-UTC clock
        run: pnpm -r --workspace-concurrency=1 test
        env:
          TZ: America/Denver

      # Menu photographs are a design contract like tokens are, and nothing
      # enforced it before: 61 assets had drifted to a 5x spread in exposure
      # and were stored in a shape no render site actually used. This fails if
      # an asset no longer matches MENU_IMAGE_SPEC. It reports, but does not
      # fail on, the photographs that are outside what grading may fix -- those
      # need reshooting, and are tracked in docs/MENU-IMAGERY.md.
      - name: Check menu imagery against the spec
        run: pnpm normalize-menu-images --check

      # Product cut-outs are a separate asset class with a separate spec, so
      # they get a separate step: a failure names which class drifted rather
      # than making someone read the output to find out. This one re-derives
      # each cut-out from its tenant master and fails if the committed asset is
      # not byte-identical -- which also catches the likeliest regression here,
      # an asset that came back flattened and still looks plausible in a diff.
      - name: Check product cut-outs against the spec
        run: pnpm normalize-product-cutouts --check

      # The bundle is part of the gate. Lint and tsc both pass on code Metro
      # cannot resolve -- a missing asset or a bad platform-specific import
      # only shows up here.
      - name: Bundle the customer app for iOS
        working-directory: apps/customer
        run: pnpm exec expo export --platform ios

      - name: Bundle the customer app for web
        working-directory: apps/customer
        run: pnpm exec expo export --platform web

      - name: Bundle the operator app for iOS
        working-directory: apps/operator
        run: pnpm exec expo export --platform ios

      # The kiosk and the display were in neither the lint list nor the bundle
      # list: this workflow did not contain the word "kiosk" or "display" at
      # all, so two of the five surfaces could break in a way only Metro or
      # Next sees and CI would stay green. Both pass today -- this is a guard,
      # not a repair.
      - name: Bundle the kiosk for iOS
        working-directory: apps/kiosk
        run: pnpm exec expo export --platform ios

      # Web too: the kiosk's static export is the surface
      # scripts/capture-surfaces.mjs drives, so a broken web bundle silently
      # turns every committed capture into an error page.
      - name: Bundle the kiosk for web
        working-directory: apps/kiosk
        run: pnpm exec expo export --platform web

      - name: Build the pickup display
        run: pnpm --filter @platform/display build

      # The one release gate in CLAUDE.md, and it existed only as a manual
      # skill. Two details make it runnable rather than theatrical:
      #
      #   - WORD BOUNDARIES, not substrings. A plain `grep -ri` matches inside
      #     unrelated identifiers and then fails forever on a coincidence; a
      #     minified Sentry helper carries one of these names inside a longer
      #     name, which docs/BUILD-REPORT.md gap 9 records.
      #   - The denylist and this workflow are excluded from their own scan.
      #     A gate that cannot name what it looks for without failing itself is
      #     a gate nobody can run.
      #   - Only tracked file CONTENT is scanned. Git history is deliberately
      #     excluded: an old commit message cannot be edited without rewriting
      #     shared history, and a release gate must never demand that rewrite.
      - name: Originality gate (CLAUDE.md rule 6)
        run: |
          set -uo pipefail
          pattern=$(grep -vE '^\s*(#|$)' .github/originality-denylist.txt \
            | paste -sd '|' -)
          hits=$(git ls-files \
            | grep -vE '\.(png|jpg|jpeg|webp|mp4|ico|lock)$' \
            | grep -vE '^(\.github/originality-denylist\.txt|\.github/workflows/verify\.yml)$' \
            | xargs grep -iEn "\\b(${pattern})\\b" 2>/dev/null || true)
          if [ -n "$hits" ]; then
            echo "FAIL: a competitor's name is in the tree (CLAUDE.md rule 6)." >&2
            echo "$hits" >&2
            exit 1
          fi
          echo "PASS: no competitor name in any tracked file."

  # One disposable hosted branch proves migrations, RLS, Realtime, the five
  # surfaces, and browser journeys without Docker or a developer machine.
  # The branch is always deleted, including after cancellation or failure.
  hosted-integration:
    # Pull-request code must never execute with the project-creation token.
    # The same exact commit receives this hosted gate after merge to main and
    # again before a deployment workflow can mutate production.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ inputs.supabase_project_ref || vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.116.0
      - name: Provision isolated hosted Supabase branch
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo '::error::Set SUPABASE_ACCESS_TOKEN.'; exit 1; }
          test -n "$SUPABASE_PROJECT_REF" || { echo '::error::Set SUPABASE_PROJECT_REF.'; exit 1; }
          branch_name="ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          {
            echo "CI_BRANCH_OWNED=true"
            echo "CI_BRANCH_NAME=$branch_name"
          } >> "$GITHUB_ENV"
          branches=$(supabase branches list --project-ref "$SUPABASE_PROJECT_REF" -o json)
          preview_ref=$(printf '%s' "$branches" | jq -r --arg name "$branch_name" \
            '[.[] | select(.name == $name)][0].project_ref // empty')
          if [ -z "$preview_ref" ]; then
            # The CLI writes human-readable provisioning progress before its
            # JSON result. Querying the authoritative branch list avoids
            # trying to parse that mixed output and also gives cleanup a stable
            # name if this step is cancelled before the project ref is known.
            # Omitting the optional Git association creates a detached branch,
            # so the Git integration cannot adopt or delete this CI database.
            supabase branches create "$branch_name" \
              --project-ref "$SUPABASE_PROJECT_REF" --size micro --yes -o json >/dev/null
            for _attempt in $(seq 1 30); do
              preview_ref=$(supabase branches list --project-ref "$SUPABASE_PROJECT_REF" -o json \
                | jq -r --arg name "$branch_name" \
                  '[.[] | select(.name == $name)][0].project_ref // empty')
              if [ -n "$preview_ref" ]; then break; fi
              sleep 2
            done
          fi
          test -n "$preview_ref" && test "$preview_ref" != null
          {
            echo "PREVIEW_PROJECT_REF=$preview_ref"
          } >> "$GITHUB_ENV"

          ready=false
          for _attempt in $(seq 1 30); do
            state=$(supabase branches list --project-ref "$SUPABASE_PROJECT_REF" -o json \
              | jq -r --arg ref "$preview_ref" '.[] | select(.project_ref == $ref) | (.preview_project_status // .status)')
            if [ "$state" = ACTIVE_HEALTHY ]; then ready=true; break; fi
            sleep 10
          done
          [ "$ready" = true ] || { echo '::error::Hosted Supabase branch did not become healthy.'; exit 1; }

          details=$(supabase branches get "$preview_ref" --project-ref "$SUPABASE_PROJECT_REF" -o json)
          SUPABASE_URL=$(printf '%s' "$details" | jq -r '.SUPABASE_URL')
          SUPABASE_PUBLISHABLE_KEY=$(printf '%s' "$details" | jq -r '.SUPABASE_ANON_KEY')
          SUPABASE_SERVICE_ROLE_KEY=$(printf '%s' "$details" | jq -r '.SUPABASE_SERVICE_ROLE_KEY')
          # GitHub's hosted runner has no route to a preview database's
          # IPv6-only direct hostname. The branch's transaction pooler is the
          # supported IPv4 path and still preserves each explicit transaction.
          SUPABASE_DB_URL=$(printf '%s' "$details" | jq -r '.POSTGRES_URL')
          export SUPABASE_URL SUPABASE_PUBLISHABLE_KEY SUPABASE_SERVICE_ROLE_KEY SUPABASE_DB_URL
          for secret_value in "$SUPABASE_PUBLISHABLE_KEY" "$SUPABASE_SERVICE_ROLE_KEY" "$SUPABASE_DB_URL"; do
            echo "::add-mask::$secret_value"
          done

          # ACTIVE_HEALTHY can arrive before the managed Storage service has
          # installed its schema. Repository migrations create buckets and RLS
          # policies, but must never create or modify Supabase-owned tables.
          storage_ready=false
          for _attempt in $(seq 1 30); do
            storage_relation=$(timeout 5s psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -Atqc \
              "select pg_catalog.to_regclass('storage.buckets')" 2>/dev/null || true)
            if [ "$storage_relation" = storage.buckets ]; then
              storage_ready=true
              break
            fi
            sleep 5
          done
          [ "$storage_ready" = true ] \
            || { echo '::error::Hosted Supabase Storage schema did not become ready.'; exit 1; }
          {
            echo "SUPABASE_URL=$SUPABASE_URL"
            echo "SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY"
            echo "SUPABASE_DB_URL=$SUPABASE_DB_URL"
          } >> "$GITHUB_ENV"

      - name: Apply and lint forward-only migrations
        run: |
          set -euo pipefail
          retry_supabase() {
            local attempt=1
            local maximum=5
            until timeout 15m "$@"; do
              if [ "$attempt" -ge "$maximum" ]; then
                echo "::error::Supabase command failed after $maximum attempts."
                return 1
              fi
              echo "::warning::Supabase command failed; retrying attempt $((attempt + 1))/$maximum."
              sleep $((attempt * 5))
              attempt=$((attempt + 1))
            done
          }

          # A new hosted branch can briefly recycle its database after the API
          # first reports ACTIVE_HEALTHY. Forward-only migrations are recorded
          # transactionally, so retrying resumes at the first unapplied file.
          retry_supabase supabase db push --db-url "$SUPABASE_DB_URL" --include-all --yes
          migrations=(supabase/migrations/*.sql)
          latest_migration="${migrations[$((${#migrations[@]} - 1))]}"
          latest_filename="${latest_migration##*/}"
          expected_readiness="${latest_filename%%_*}"
          actual_readiness=$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -Atqc \
            'select public.platform_release_readiness()')
          [ "$actual_readiness" = "$expected_readiness" ] \
            || { echo '::error::Hosted release readiness does not match the newest migration.'; exit 1; }
          retry_supabase supabase db lint --db-url "$SUPABASE_DB_URL" --level warning --fail-on warning
          retry_supabase supabase db advisors --db-url "$SUPABASE_DB_URL" \
            --type security --level warn --fail-on warn
          retry_supabase supabase db advisors --db-url "$SUPABASE_DB_URL" \
            --type performance --level warn --fail-on warn

      - name: Seed through the production onboarding path
        run: pnpm onboard --tenant coffee-story --require-db

      - name: Run integration suites against hosted Supabase
        run: |
          set -euo pipefail
          export SUPABASE_TEST_URL="$SUPABASE_URL"
          export SUPABASE_TEST_ANON_KEY="$SUPABASE_PUBLISHABLE_KEY"
          export SUPABASE_TEST_SERVICE_ROLE_KEY="$SUPABASE_SERVICE_ROLE_KEY"
          export SUPABASE_TEST_DB_URL="$SUPABASE_DB_URL"
          # Without this the suites skip on a missing variable and report
          # `tests 0 / pass 0 / fail 0`, which is indistinguishable from a
          # pass. This is the one job where that would be a lie, so a missing
          # stack fails at import instead.
          export REQUIRE_DATABASE_TESTS=1
          pnpm --filter @platform/integration-tests test

      - name: Install the Playwright browser
        working-directory: tests/e2e
        run: pnpm exec playwright install --with-deps chromium
      - name: Build all five surfaces against hosted Supabase
        run: |
          set -euo pipefail
          ( cd apps/customer && \
            EXPO_PUBLIC_SUPABASE_URL="$SUPABASE_URL" \
            EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            EXPO_PUBLIC_API_URL="http://127.0.0.1:4383" \
            pnpm exec expo export --platform web --output-dir dist-e2e )
          ( cd apps/operator && \
            EXPO_PUBLIC_SUPABASE_URL="$SUPABASE_URL" \
            EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            EXPO_PUBLIC_API_URL="http://127.0.0.1:4383" \
            pnpm exec expo export --platform web --output-dir dist-e2e )
          ( cd apps/kiosk && \
            EXPO_PUBLIC_SUPABASE_URL="$SUPABASE_URL" \
            EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            EXPO_PUBLIC_API_URL="http://127.0.0.1:4383" \
            pnpm exec expo export --platform web --output-dir dist-e2e )
          NEXT_PUBLIC_SUPABASE_URL="$SUPABASE_URL" \
            NEXT_PUBLIC_SUPABASE_ANON_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            pnpm --filter @platform/hq build
          NEXT_PUBLIC_SUPABASE_URL="$SUPABASE_URL" \
            pnpm --filter @platform/display build
      - name: Run the end-to-end suite
        run: |
          set -euo pipefail
          export SUPABASE_TEST_URL="$SUPABASE_URL"
          export SUPABASE_TEST_ANON_KEY="$SUPABASE_PUBLISHABLE_KEY"
          export SUPABASE_TEST_SERVICE_ROLE_KEY="$SUPABASE_SERVICE_ROLE_KEY"
          export SUPABASE_TEST_DB_URL="$SUPABASE_DB_URL"
          export E2E_CUSTOMER_DIR="$GITHUB_WORKSPACE/apps/customer/dist-e2e"
          export E2E_OPERATOR_DIR="$GITHUB_WORKSPACE/apps/operator/dist-e2e"
          export E2E_HQ_DIR="$GITHUB_WORKSPACE/apps/hq"
          export E2E_SHOT_DIR="$GITHUB_WORKSPACE/e2e-shots"
          # Same reason as the integration step: a skipped E2E suite reports
          # zero tests and reads as green.
          export REQUIRE_DATABASE_TESTS=1
          # Kept as well as printed: the Actions log API only ever returns the
          # END of a job, so a test failure in the middle is invisible to
          # anything reading it programmatically -- and the driver's dump of
          # the page it gave up on is exactly what makes such a failure
          # diagnosable. The last step replays this when the job fails.
          set +e
          pnpm --filter @platform/e2e-tests test 2>&1 | tee "$GITHUB_WORKSPACE/e2e-output.log"
          status=${PIPESTATUS[0]}
          exit "$status"
      - name: Keep the walkthrough screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-screenshots
          path: |
            e2e-shots/
            e2e-output.log
          if-no-files-found: ignore

      - name: Replay the failure at the end of the log
        if: failure()
        run: |
          echo '=================== e2e output (tail) ==================='
          tail -120 "$GITHUB_WORKSPACE/e2e-output.log" 2>/dev/null || echo '(no output captured)'

      - name: Delete hosted Supabase branch
        if: always()
        run: |
          # This workflow always owns its synthetic branch and must remove it
          # even after cancellation. Treat an already-removed branch as a
          # successful idempotent cleanup.
          if [ "${CI_BRANCH_OWNED:-false}" = true ]; then
            cleanup_ref="${PREVIEW_PROJECT_REF:-}"
            if [ -z "$cleanup_ref" ] && [ -n "${CI_BRANCH_NAME:-}" ]; then
              cleanup_ref=$(supabase branches list --project-ref "$SUPABASE_PROJECT_REF" -o json \
                | jq -r --arg name "$CI_BRANCH_NAME" \
                  '[.[] | select(.name == $name)][0].project_ref // empty')
            fi
            if [ -n "$cleanup_ref" ]; then
              set +e
              cleanup_output=$(supabase branches delete "$cleanup_ref" \
                --project-ref "$SUPABASE_PROJECT_REF" --yes 2>&1)
              cleanup_status=$?
              set -e
              if [ "$cleanup_status" -ne 0 ]; then
                case "$cleanup_output" in
                  *'Resource has been removed'*) ;;
                  *)
                    printf '%s\n' "$cleanup_output" >&2
                    exit "$cleanup_status"
                    ;;
                esac
              fi
            fi
          fi

  # The RLS suite, on a pull request, against a database that exists only for
  # the length of this job.
  #
  # `hosted-integration` cannot do this and should not try: it holds the
  # project-creation token, so it is gated to non-pull-request events and
  # branch code never runs with that credential. The consequence was that no
  # pull request in this repository had ever executed a migration, an RLS
  # policy, or the claims hook -- a PR that broke tenant isolation was green
  # and only failed after reaching main, which is exactly how a 42P13 in
  # 20260903041500 left main unable to migrate for six merges.
  #
  # A local stack closes that without touching the gap that keeps the token
  # safe: `supabase start` boots Postgres, GoTrue, Realtime and the API in
  # Docker on the runner, from this branch's own config.toml, with no secret
  # anywhere. Nothing it can leak exists.
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.116.0

      # Applies every migration in order, which is itself the check: a
      # migration that cannot be applied fails here rather than on main. The
      # custom access token hook is declared in config.toml, so the claims it
      # mints are exercised too.
      - name: Start a local Supabase and apply the migration chain
        run: supabase start --ignore-health-check

      # `status -o env` with explicit --override-name, rather than -o json and a
      # guess at the key names. The dotted names on the left are the CLI's own
      # identifiers and the documented way to ask for a variable, so this does
      # not depend on how a given CLI version happens to spell DB_URL. The
      # first version of this job did guess, got null, and ran `psql ""`.
      #
      # Written to a file and sourced under `set -a` so the values never appear
      # in a command line, and so the keys stay out of the step's own log.
      - name: Read the local stack's connection details
        run: |
          set -euo pipefail
          supabase status -o env \
            --override-name api.url=SUPABASE_TEST_URL \
            --override-name auth.anon_key=SUPABASE_TEST_ANON_KEY \
            --override-name auth.service_role_key=SUPABASE_TEST_SERVICE_ROLE_KEY \
            --override-name db.url=SUPABASE_TEST_DB_URL > stack.env
          set -a; . ./stack.env; set +a
          for name in SUPABASE_TEST_URL SUPABASE_TEST_ANON_KEY SUPABASE_TEST_SERVICE_ROLE_KEY SUPABASE_TEST_DB_URL; do
            test -n "${!name:-}" || { echo "::error::$name came back empty from supabase status."; exit 1; }
            echo "$name is set"
          done
          # Only the two URLs are echoed into the environment file; both keys
          # are local-only test credentials but there is no reason to print them.
          {
            echo "SUPABASE_TEST_URL=$SUPABASE_TEST_URL"
            echo "SUPABASE_TEST_DB_URL=$SUPABASE_TEST_DB_URL"
            echo "SUPABASE_TEST_ANON_KEY=$SUPABASE_TEST_ANON_KEY"
            echo "SUPABASE_TEST_SERVICE_ROLE_KEY=$SUPABASE_TEST_SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"
          echo "API $SUPABASE_TEST_URL"

      # Seed through the real provisioning path, exactly as hosted-integration
      # does, and for the same reason: platform_release_readiness() executes
      # every registered assertion, and the frozen 26-link chain among them
      # asserts backfill parity between a brand's legacy flags and its module
      # installations. On an empty database those assertions have nothing to
      # check; the first run of this job asserted readiness against a database
      # with no tenant in it and failed there rather than on anything real.
      #
      # It also means a pull request now exercises onboarding, which is the
      # provisioning path every future franchisee goes through and had no
      # coverage outside the hosted job.
      - name: Seed through the production onboarding path
        run: |
          set -euo pipefail
          export SUPABASE_URL="$SUPABASE_TEST_URL"
          export SUPABASE_SERVICE_ROLE_KEY="$SUPABASE_TEST_SERVICE_ROLE_KEY"
          pnpm onboard --tenant coffee-story --require-db

      # Same comparison hosted-integration makes on main: the newest migration
      # filename must equal what the release registry reports, or the chain and
      # the health probe disagree. Both sides are printed either way, so a
      # mismatch says what it actually found.
      - name: Check the release registry matches the newest migration
        run: |
          set -euo pipefail
          command -v psql >/dev/null || { echo '::error::psql is not on PATH.'; exit 1; }
          latest=$(ls supabase/migrations/*.sql | tail -1 | xargs basename)
          expected="${latest%%_*}"
          actual=$(psql "$SUPABASE_TEST_DB_URL" -v ON_ERROR_STOP=1 -Atqc \
            'select app.platform_release_readiness()')
          echo "newest migration: $latest (expects $expected)"
          echo "registry reports: ${actual:-<empty>}"
          test "$actual" = "$expected" || {
            echo "::error::Release readiness is ${actual:-<empty>} but the newest migration is $expected."
            exit 1
          }

      - name: Run the RLS and authorization suites
        run: |
          set -euo pipefail
          # A skipped suite reports `tests 0 / pass 0 / fail 0`, which reads
          # exactly like a pass. In the job whose entire purpose is running
          # them, a missing variable must fail at import instead.
          export REQUIRE_DATABASE_TESTS=1
          pnpm --filter @platform/integration-tests test

      - name: Advisors, on the schema this branch actually produces
        run: supabase db lint --level warning --fail-on warning --db-url "$SUPABASE_TEST_DB_URL"

      # Always, so a failed run does not leave containers holding the runner's
      # disk for the rest of the job's lifetime.
      - name: Stop the local stack
        if: always()
        run: supabase stop --no-backup || true

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Both graphs, because `expo` is a production dependency that drags the
      # whole bundler in with it -- the metro/image-size advisories this repo
      # pins around showed up in the production-only audit.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Audit the full dependency graph
        run: pnpm audit --audit-level=high

  # Publishes the Expo Go demo of the customer app. This lives in the same
  # workflow as the gate rather than in its own file so it can `needs:` those
  # jobs directly -- a separate workflow could only watch for them with
  # `workflow_run`, which runs against the default branch's copy of the file
  # and has to re-derive the sha.
  #
  # Preview only, deliberately. `apps/customer/app.json` pins `runtimeVersion`
  # to `exposdk:54.0.0` for every channel (docs/PRODUCTION_SETUP.md gap 2), so
  # a production update is runtime-compatible with Expo Go clients and preview
  # builds alike. Publishing production automatically would let a merge reach
  # store users. That stays a manual `pnpm run publish:production` in
  # apps/customer.
  #
  # Dispatch-only, at the owner's request: merging to main runs the gate but
  # never publishes. A deploy happens when someone triggers this workflow with
  # the publish input checked (Actions -> verify -> Run workflow).
  publish-preview:
    needs: [verify, hosted-integration, security, audit]
    if: github.event_name == 'workflow_dispatch' && (inputs.publish || inputs.publish_operator)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Attach a GitHub Environment named `expo-preview` to this job to require a
    # human approval before each publish. Left off so the first publish works
    # without extra setup.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Fails loudly rather than skipping. A publish job that quietly no-ops
      # reports green, and you find out the demo was never updated when someone
      # scans the QR and gets last month's build.
      #
      # Checked in the shell, not in `if:` -- the `secrets` context is not
      # available to a step-level condition, so `if: ${{ !secrets.EXPO_TOKEN }}`
      # would evaluate to false and the guard would never fire.
      #
      # Two secret names are accepted because the repo owner created theirs as
      # EXPO_GO_COFFEE; either satisfies the guard and both feed the same
      # EXPO_TOKEN env var eas-cli reads.
      - name: Require an EAS token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN || secrets.EXPO_GO_COFFEE }}
        run: |
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "::error::No EAS token is set. Create one at https://expo.dev/settings/access-tokens and add it as a repository secret named EXPO_TOKEN or EXPO_GO_COFFEE (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi
          echo "EAS token present."

      # `--environment preview` reads the preview environment's variables from
      # EAS server-side; nothing here is inlined from a local .env. Expo Go
      # opens in Demo whatever they contain -- see `parseStoredAppMode`.
      #
      # The commit subject reaches the CLI through the environment, never
      # interpolated into the shell: a commit message is attacker-controllable
      # text and `${{ }}` inside a `run:` is a command-injection hole.
      - name: Publish to the preview channel
        if: inputs.publish
        working-directory: apps/customer
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN || secrets.EXPO_GO_COFFEE }}
          COMMIT_SUBJECT: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          subject="${COMMIT_SUBJECT:-}"
          message="${subject%%$'\n'*}"
          [ -n "$message" ] || message="Manual publish of ${GITHUB_SHA:0:7}"
          # --json implies --non-interactive and puts everything that is not
          # JSON on stderr, so this redirect captures the manifest alone.
          # --silent keeps pnpm's own banner out of it too.
          pnpm --silent run publish:preview:all --json --message "$message" > update.json

      # Reporting must never turn a successful publish red, so this step is
      # `continue-on-error`: by the time it runs the update is already live.
      - name: Report the QR and deep link
        if: inputs.publish
        continue-on-error: true
        run: node .github/scripts/report-update.mjs apps/customer/update.json

      # The operator app is one listing for every tenant (rule 7), so its EAS
      # project is fixed rather than tenant-generated. `eas init` links the
      # project by owner+slug from app.json, creating it on the first publish;
      # the projectId it writes into the CI workspace's app.json is never
      # committed. No --environment: the demo needs no EXPO_PUBLIC_* values.
      - name: Publish the operator app to the preview channel
        if: inputs.publish_operator
        working-directory: apps/operator
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN || secrets.EXPO_GO_COFFEE }}
          COMMIT_SUBJECT: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          npx eas-cli@21.4.0 init --non-interactive --force
          subject="${COMMIT_SUBJECT:-}"
          message="${subject%%$'\n'*}"
          [ -n "$message" ] || message="Manual operator publish of ${GITHUB_SHA:0:7}"
          pnpm --silent run publish:preview:all --json --message "$message" > update.json

      - name: Report the operator QR and deep link
        if: inputs.publish_operator
        continue-on-error: true
        run: node .github/scripts/report-update.mjs apps/operator/update.json

      - name: Keep the update manifest for the run
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eas-update-manifest
          path: |
            apps/customer/update.json
            apps/operator/update.json
          if-no-files-found: ignore
