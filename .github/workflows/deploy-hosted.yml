name: deploy hosted surfaces

# Production deploys are intentionally owner-triggered. The verification
# workflow is the required gate; this workflow only runs after that gate has
# passed, and every credential comes from GitHub/Vercel secrets.
on:
  workflow_call:
    inputs:
      tenant:
        type: string
        default: coffee-story
      project_prefix:
        type: string
        default: coffee-story
      supabase_project_ref:
        type: string
        required: false
      environment:
        type: string
        default: production
      deploy_web:
        type: boolean
        default: true
      publish_native:
        type: boolean
        default: false
    secrets:
      VERCEL_TOKEN:
        required: true
      SUPABASE_ACCESS_TOKEN:
        required: true
      SUPABASE_URL:
        required: false
      SUPABASE_PUBLISHABLE_KEY:
        required: false
      SUPABASE_SERVICE_ROLE_KEY:
        required: false
      SUPABASE_JWT_SECRET:
        required: false
      CRON_SECRET:
        required: true
      OPENAI_API_KEY:
        required: false
      DISPLAY_DEVICE_TOKEN:
        required: false
      EXPO_TOKEN:
        required: false
      EXPO_PUBLIC_API_URL:
        required: false
      EXPO_PUBLIC_ALLOWED_API_HOST:
        required: false
  workflow_dispatch:
    inputs:
      tenant:
        description: Tenant slug bundled into customer and kiosk surfaces
        type: string
        default: coffee-story
      project_prefix:
        description: Existing Vercel project prefix (prefix-hq, prefix-customer, etc.)
        type: string
        default: coffee-story
      supabase_project_ref:
        description: Hosted Supabase project reference (defaults to repository variable)
        type: string
        required: false
      environment:
        description: Vercel and EAS environment to promote
        type: choice
        options: [preview, production]
        default: production
      deploy_web:
        description: Deploy HQ, pickup display, and the three Expo web builds
        type: boolean
        default: true
      publish_native:
        description: Publish production OTA updates to all three EAS projects
        type: boolean
        default: false

concurrency:
  group: hosted-${{ inputs.project_prefix || 'coffee-story' }}-${{ inputs.environment || 'production' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  VERCEL_CLI_VERSION: 59.3.0
  VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE || 'tylerdevries222s-projects' }}
  SUPABASE_PROJECT_REF: ${{ inputs.supabase_project_ref || vars.SUPABASE_PROJECT_REF }}
  TENANT: ${{ inputs.tenant || 'coffee-story' }}
  PROJECT_PREFIX: ${{ inputs.project_prefix || 'coffee-story' }}
  DEPLOY_ENVIRONMENT: ${{ inputs.environment || 'production' }}

jobs:
  gate:
    name: Verify before deployment
    uses: ./.github/workflows/verify.yml
    with:
      supabase_project_ref: ${{ inputs.supabase_project_ref || vars.SUPABASE_PROJECT_REF }}
    secrets: inherit

  migrate-database:
    name: Promote verified database migrations
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply and verify forward-only target migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo '::error::Set SUPABASE_ACCESS_TOKEN.'; exit 1; }
          test -n "$SUPABASE_PROJECT_REF" || { echo '::error::Set SUPABASE_PROJECT_REF.'; exit 1; }
          pnpm supabase:promote

  deploy-hq:
    name: Deploy HQ API and console
    needs: migrate-database
    if: inputs.deploy_web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.116.0
      - name: Resolve the target Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo '::error::Set SUPABASE_ACCESS_TOKEN.'; exit 1; }
          test -n "$SUPABASE_PROJECT_REF" || { echo '::error::Set SUPABASE_PROJECT_REF.'; exit 1; }
          keys=$(supabase projects api-keys --project-ref "$SUPABASE_PROJECT_REF" -o json)
          publishable=$(printf '%s' "$keys" | jq -r '[.[] | select(.type == "publishable")][0].api_key // [.[] | select(.name == "anon")][0].api_key')
          service_role=$(printf '%s' "$keys" | jq -r '[.[] | select(.name == "service_role")][0].api_key')
          test -n "$publishable" && test "$publishable" != null
          test -n "$service_role" && test "$service_role" != null
          echo "::add-mask::$service_role"
          {
            echo "SUPABASE_URL=https://${SUPABASE_PROJECT_REF}.supabase.co"
            echo "SUPABASE_PUBLISHABLE_KEY=$publishable"
            echo "SUPABASE_SERVICE_ROLE_KEY=$service_role"
          } >> "$GITHUB_ENV"
      - name: Require Vercel credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$VERCEL_TOKEN" || { echo '::error::Set VERCEL_TOKEN.'; exit 1; }
          test -n "$SUPABASE_URL" || { echo '::error::Set SUPABASE_URL.'; exit 1; }
          test -n "$SUPABASE_PUBLISHABLE_KEY" || { echo '::error::Set SUPABASE_PUBLISHABLE_KEY.'; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo '::error::Set SUPABASE_SERVICE_ROLE_KEY.'; exit 1; }
          test -n "$CRON_SECRET" || { echo '::error::Set CRON_SECRET.'; exit 1; }
      - name: Configure hosted server environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_RESEARCH_MODEL: ${{ vars.OPENAI_RESEARCH_MODEL }}
          OPENAI_EVALUATION_MODEL: ${{ vars.OPENAI_EVALUATION_MODEL }}
        run: |
          set -euo pipefail
          project="${PROJECT_PREFIX}-hq"
          add_secret() {
            local name="$1" value="$2"
            test -n "$value" || return 0
            npx --yes "vercel@${VERCEL_CLI_VERSION}" env add "$name" "$DEPLOY_ENVIRONMENT" \
              --project "$project" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" \
              --value "$value" --sensitive --force --yes >/dev/null
          }
          add_public() {
            local name="$1" value="$2"
            test -n "$value" || return 0
            npx --yes "vercel@${VERCEL_CLI_VERSION}" env add "$name" "$DEPLOY_ENVIRONMENT" \
              --project "$project" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" \
              --value "$value" --no-sensitive --force --yes >/dev/null
          }
          add_public SUPABASE_URL "$SUPABASE_URL"
          add_public NEXT_PUBLIC_SUPABASE_URL "$SUPABASE_URL"
          add_public NEXT_PUBLIC_SUPABASE_ANON_KEY "$SUPABASE_PUBLISHABLE_KEY"
          add_secret SUPABASE_SERVICE_ROLE_KEY "$SUPABASE_SERVICE_ROLE_KEY"
          # Required for issuing and validating kiosk/display device tokens.
          # Keep this optional so a web-only deployment can still fail closed
          # on device pairing without blocking its other hosted surfaces.
          add_secret SUPABASE_JWT_SECRET "$SUPABASE_JWT_SECRET"
          add_secret CRON_SECRET "$CRON_SECRET"
          add_secret OPENAI_API_KEY "$OPENAI_API_KEY"
          add_public OPENAI_RESEARCH_MODEL "$OPENAI_RESEARCH_MODEL"
          add_public OPENAI_EVALUATION_MODEL "$OPENAI_EVALUATION_MODEL"
      - name: Promote the exact verified HQ commit
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          project="${PROJECT_PREFIX}-hq"
          deployment_url=''
          for _attempt in $(seq 1 30); do
            deployments=$(npx --yes "vercel@${VERCEL_CLI_VERSION}" list "$project" \
              --status READY --meta "githubCommitSha=$GITHUB_SHA" --limit 1 --json \
              --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN")
            deployment_url=$(printf '%s' "$deployments" | jq -r '.deployments[0].url // empty')
            [ -n "$deployment_url" ] && break
            sleep 10
          done
          [ -n "$deployment_url" ] || { echo '::error::Exact HQ deployment was not READY.'; exit 1; }
          redeployed_url=$(npx --yes "vercel@${VERCEL_CLI_VERSION}" redeploy "$deployment_url" \
            --target "$DEPLOY_ENVIRONMENT" --no-wait --no-color \
            --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" | tail -1)
          case "$redeployed_url" in
            https://*.vercel.app|*.vercel.app) ;;
            *) echo '::error::Vercel did not return the exact HQ redeployment URL.'; exit 1 ;;
          esac
          inspection=$(npx --yes "vercel@${VERCEL_CLI_VERSION}" inspect "$redeployed_url" \
            --wait --timeout 8m --json --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN")
          [ "$(printf '%s' "$inspection" | jq -r '.readyState')" = READY ] \
            || { echo '::error::Exact HQ redeployment did not become READY.'; exit 1; }
          if [ "$DEPLOY_ENVIRONMENT" = production ]; then
            npx --yes "vercel@${VERCEL_CLI_VERSION}" promote "$redeployed_url" --yes --timeout 5m \
              --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
            public_url="https://${project}.vercel.app"
          else
            public_url="$redeployed_url"
            [[ "$public_url" = https://* ]] || public_url="https://${public_url}"
          fi
          echo "url=$public_url" >> "$GITHUB_OUTPUT"
          echo "HQ verified at $public_url"

  deploy-web:
    name: Deploy ${{ matrix.surface }} web app
    needs: deploy-hq
    if: inputs.deploy_web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - surface: display
          - surface: customer
          - surface: operator
          - surface: kiosk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.116.0
      - name: Resolve the target Supabase public configuration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo '::error::Set SUPABASE_ACCESS_TOKEN.'; exit 1; }
          keys=$(supabase projects api-keys --project-ref "$SUPABASE_PROJECT_REF" -o json)
          publishable=$(printf '%s' "$keys" | jq -r '[.[] | select(.type == "publishable")][0].api_key // [.[] | select(.name == "anon")][0].api_key')
          test -n "$publishable" && test "$publishable" != null
          {
            echo "SUPABASE_URL=https://${SUPABASE_PROJECT_REF}.supabase.co"
            echo "SUPABASE_PUBLISHABLE_KEY=$publishable"
          } >> "$GITHUB_ENV"
      - name: Configure hosted runtime environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DISPLAY_DEVICE_TOKEN: ${{ secrets.DISPLAY_DEVICE_TOKEN }}
        run: |
          set -euo pipefail
          add_public() {
            local name="$1" value="$2"
            npx --yes "vercel@${VERCEL_CLI_VERSION}" env add "$name" "$DEPLOY_ENVIRONMENT" \
              --project "${PROJECT_PREFIX}-${{ matrix.surface }}" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" \
              --value "$value" --no-sensitive --force --yes >/dev/null
          }
          add_secret() {
            local name="$1" value="$2"
            test -n "$value" || return 0
            npx --yes "vercel@${VERCEL_CLI_VERSION}" env add "$name" "$DEPLOY_ENVIRONMENT" \
              --project "${PROJECT_PREFIX}-${{ matrix.surface }}" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" \
              --value "$value" --sensitive --force --yes >/dev/null
          }
          if [ "${{ matrix.surface }}" = display ]; then
            add_public NEXT_PUBLIC_SUPABASE_URL "$SUPABASE_URL"
            add_public HQ_ORIGIN "${{ needs.deploy-hq.outputs.url }}"
            if [ "$DEPLOY_ENVIRONMENT" = production ]; then
              test -n "$DISPLAY_DEVICE_TOKEN" || { echo '::error::Set DISPLAY_DEVICE_TOKEN after pairing the production screen.'; exit 1; }
              add_public DISPLAY_DEMO_MODE 0
            else
              # A branch preview is a review surface, not a paired shop screen.
              # Keep production fail-closed while making preview deployments
              # independently demonstrable without reusing a live device token.
              add_public DISPLAY_DEMO_MODE 1
            fi
            add_secret DISPLAY_DEVICE_TOKEN "$DISPLAY_DEVICE_TOKEN"
          else
            api_url="${{ needs.deploy-hq.outputs.url }}"
            api_host="${api_url#https://}"
            api_host="${api_host%%/*}"
            case "$api_host" in
              *.vercel.app) ;;
              *) echo '::error::The verified HQ deployment did not provide a Vercel hostname.'; exit 1 ;;
            esac
            add_public EXPO_PUBLIC_SUPABASE_URL "$SUPABASE_URL"
            add_public EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY "$SUPABASE_PUBLISHABLE_KEY"
            add_public EXPO_PUBLIC_API_URL "$api_url"
            add_public EXPO_PUBLIC_ALLOWED_API_HOST "$api_host"
            add_public TENANT "$TENANT"
          fi
      - name: Promote the exact verified web commit
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          project="${PROJECT_PREFIX}-${{ matrix.surface }}"
          deployment_url=''
          for _attempt in $(seq 1 30); do
            deployments=$(npx --yes "vercel@${VERCEL_CLI_VERSION}" list "$project" \
              --status READY --meta "githubCommitSha=$GITHUB_SHA" --limit 1 --json \
              --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN")
            deployment_url=$(printf '%s' "$deployments" | jq -r '.deployments[0].url // empty')
            [ -n "$deployment_url" ] && break
            sleep 10
          done
          [ -n "$deployment_url" ] || { echo "::error::Exact $project deployment was not READY."; exit 1; }
          redeployed_url=$(npx --yes "vercel@${VERCEL_CLI_VERSION}" redeploy "$deployment_url" \
            --target "$DEPLOY_ENVIRONMENT" --no-wait --no-color \
            --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" | tail -1)
          case "$redeployed_url" in
            https://*.vercel.app|*.vercel.app) ;;
            *) echo "::error::Vercel did not return the exact $project redeployment URL."; exit 1 ;;
          esac
          inspection=$(npx --yes "vercel@${VERCEL_CLI_VERSION}" inspect "$redeployed_url" \
            --wait --timeout 8m --json --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN")
          [ "$(printf '%s' "$inspection" | jq -r '.readyState')" = READY ] \
            || { echo "::error::Exact $project redeployment did not become READY."; exit 1; }
          if [ "$DEPLOY_ENVIRONMENT" = production ]; then
            npx --yes "vercel@${VERCEL_CLI_VERSION}" promote "$redeployed_url" --yes --timeout 5m \
              --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
          fi

  publish-native:
    name: Publish native OTA updates
    needs: migrate-database
    if: inputs.publish_native && inputs.environment == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.116.0
      - name: Resolve the target Supabase public configuration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          keys=$(supabase projects api-keys --project-ref "$SUPABASE_PROJECT_REF" -o json)
          publishable=$(printf '%s' "$keys" | jq -r '[.[] | select(.type == "publishable")][0].api_key // [.[] | select(.name == "anon")][0].api_key')
          test -n "$publishable" && test "$publishable" != null
          {
            echo "SUPABASE_URL=https://${SUPABASE_PROJECT_REF}.supabase.co"
            echo "SUPABASE_PUBLISHABLE_KEY=$publishable"
          } >> "$GITHUB_ENV"
      - name: Require EAS credentials and production API configuration
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
        run: |
          test -n "$EXPO_TOKEN" || { echo '::error::Set EXPO_TOKEN.'; exit 1; }
          test -n "$API_URL" || { echo '::error::Set EXPO_PUBLIC_API_URL to the deployed HQ URL.'; exit 1; }
      - name: Publish customer update
        working-directory: apps/customer
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_ALLOWED_API_HOST: ${{ secrets.EXPO_PUBLIC_ALLOWED_API_HOST }}
        run: |
          EXPO_PUBLIC_SUPABASE_URL="$SUPABASE_URL" \
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            npx --yes eas-cli@21.4.0 update --channel production --environment production --platform all --non-interactive
      - name: Publish operator update
        working-directory: apps/operator
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_ALLOWED_API_HOST: ${{ secrets.EXPO_PUBLIC_ALLOWED_API_HOST }}
        run: |
          EXPO_PUBLIC_SUPABASE_URL="$SUPABASE_URL" \
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            npx --yes eas-cli@21.4.0 update --channel production --platform all --non-interactive
      - name: Publish kiosk update
        working-directory: apps/kiosk
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_ALLOWED_API_HOST: ${{ secrets.EXPO_PUBLIC_ALLOWED_API_HOST }}
        run: |
          EXPO_PUBLIC_SUPABASE_URL="$SUPABASE_URL" \
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            npx --yes eas-cli@21.4.0 update --channel production --platform all --non-interactive
